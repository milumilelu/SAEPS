gamma:
  definition: alpha_times_lambda_max_of_JthetaT_Jtheta_at_center
  alpha: 1.0e-8
curvature_solver:
  selected: scaled_LSQR_iterative_refinement
  formulation: augmented_least_squares
  scaling: exact_diag_JthetaT_Jtheta_plus_gammaI_via_basis_JVPs
  tolerance: 1.0e-10
  max_iterations_per_pass: 500
  refinement_passes: 2
  maximum_total_iterations: 1500
  verified_normal_residual_acceptance: 1.0e-8
  explicit_reference_relative_acceptance: 1.0e-6
gold_standard:
  quantity: exact_finite_gamma_reduced_Hessian
  formula: Hll_minus_Hltheta_times_inverse_Hthetatheta_plus_gammaI_times_Hthetalambda
  symmetry_relative_tolerance: 1.0e-8
  positive_eigenvalue_relative_tolerance: 1.0e-10
  solve_relative_tolerance: 1.0e-8
errors:
  denominator_floor: 1.0e-8
  Fse_GN_source: selected_scaled_LSQR_iterative_refinement
  E_raw: abs_Fraw_minus_Hred_exact_gamma_over_abs_Hred_exact_gamma_plus_floor
  E_SAEPS: abs_Fse_GN_minus_Hred_exact_gamma_over_abs_Hred_exact_gamma_plus_floor
  D: E_raw_minus_E_SAEPS
valid_pair:
  requires: [center_pass, exact_gold_pass, selected_solver_pass, all_primary_quantities_finite]
  allowed_final_statuses: [PASS, CHECKPOINT_INVALID, SOLVER_FAILURE, NUMERICAL_FAILURE]
  invalid_seed_numeric_primary_excluded: true
  invalid_seed_retained_in_planned_denominator: true
primary:
  alternative: D_greater_than_zero
  strict_win_rule: D_greater_than_tie_tolerance
  tie_tolerance: 1.0e-12
  tie_rule: planned_nonwin_and_excluded_from_sign_test
  planned_denominator: 15
  minimum_valid_pairs: 12
  planned_seed_wins_required: 12
  valid_pair_median_D_must_be_positive: true
  test: exact_one_sided_paired_sign_test
  null_success_probability: 0.5
  alpha: 0.05
  continuity_correction: false
  success_requires_all_primary_conditions: true
secondary:
  E_SAEPS_summary: [median, IQR, range, all_seed_values]
  median_definition: average_two_middle_order_statistics_when_even
  IQR_definition: q25_and_q75_numpy_linear_quantiles_then_q75_minus_q25
  range_definition: minimum_and_maximum
  report_E_raw: true
  report_planned_valid_invalid_counts: true
  historical_5_percent_statement: SAEPS_is_not_uniformly_accurate_within_5_percent
  five_percent_is_universal_accuracy_requirement: false
gn_indicator:
  name: first_order_correction_relative_to_GN
  definition: abs_deltaH_first_over_max_abs_Fse_GN_and_1e-8
  deltaH_first: Sll_minus_2_xT_Sthetalambda_plus_xT_Sthetatheta_x
  x_definition: inverse_JthetaT_Jtheta_plus_gammaI_times_JthetaT_Jlambda
  threshold: 0.05
  predicted_class: within_5_percent_if_indicator_less_than_or_equal_to_threshold
  observed_class: within_5_percent_if_E_SAEPS_less_than_or_equal_to_threshold
  recalibration_forbidden: true
  role: secondary_nonbinding_diagnostic
  reports: [confusion_matrix, accuracy, spearman_with_E_SAEPS, median_absolute_calibration_error, all_seed_values]
reporting:
  failed_and_invalid_seeds_must_be_visible: true
  paper_facing_values_generated_from_machine_readable_results: true
  posthoc_threshold_or_endpoint_changes_forbidden: true
  scientific_outcomes: [SUPPORTED, PARTIALLY_SUPPORTED, NOT_SUPPORTED]
  insufficient_valid_pairs_outcome: NOT_SUPPORTED_with_insufficient_valid_pairs_reason
