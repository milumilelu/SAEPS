schema_version: 1
contract_id: SAEPS-V5.3A-TWO-PARAMETER-DEVELOPMENT-EXECUTION
phase: V5_3A_TWO_PARAMETER_DEVELOPMENT
seeds: [210, 211, 212]
source_protocol: configs/v4_6/two_parameter_development.yaml
architecture_width: 6
gamma_alpha: 1.0e-8
center_policy:
  name: extended_deterministic_multistart_GN_exact_trust
  start_relative_radii: [0.0, 0.005, 0.01, 0.03, 0.06, 0.1]
  perturbation_seed_offset: 53000
  multidirection_escape:
    maximum_cycles: 100
    maximum_negative_directions: 20
    relative_radii: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2, 3.0e-2, 1.0e-1, 2.0e-1, 3.0e-1]
    minimum_actual_decrease: 1.0e-12
  gauss_newton:
    maximum_iterations: 300
    initial_damping: 1.0e-6
    minimum_damping: 1.0e-12
    maximum_damping: 1.0e4
    accepted_damping_factor: 0.3
    rejected_damping_factor: 10.0
    maximum_relative_step: 0.1
    backtracking_factors: [1.0, 0.5, 0.25, 0.125, 0.0625]
    normalized_gradient_tolerance: 1.0e-7
local_optimizer_extension:
  optimizer_outer_steps_max: 60
  polish_outer_steps_max: 40
development_gate:
  required_binding_valid: 3
  requires: [center_pass, state_rmse_pass, solver_pass, exact_pass, nontrivial_coupling_pass]
selection_forbidden_metrics: [D2, E_raw2, E_SAEPS2, favorable_eigenvalues, eigenvectors, figure_appearance]
scientific_comparison_computed: false
output_root: outputs/runs/v5/two_parameter/development
