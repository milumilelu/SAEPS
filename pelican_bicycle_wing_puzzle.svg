<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#75c9f4"/><stop offset="1" stop-color="#eaf8ff"/></linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7edf3"/><stop offset="0.5" stop-color="#aab8c8"/><stop offset="1" stop-color="#60758d"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff09a"/><stop offset="0.45" stop-color="#e7b83e"/><stop offset="1" stop-color="#9e6418"/></linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#d9e6ee"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-opacity=".28"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="rivets" width="46" height="46" patternUnits="userSpaceOnUse"><circle cx="23" cy="23" r="3" fill="#6f859c"/><circle cx="23" cy="23" r="1" fill="#e9f0f5"/></pattern>
  </defs>

  <!-- sky and clouds -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#fff" opacity=".7" filter="url(#soft)">
    <ellipse cx="180" cy="145" rx="120" ry="35"/><ellipse cx="280" cy="150" rx="90" ry="28"/><ellipse cx="1320" cy="140" rx="150" ry="42"/><ellipse cx="1450" cy="150" rx="90" ry="27"/>
    <ellipse cx="1160" cy="370" rx="150" ry="38"/><ellipse cx="1270" cy="370" rx="100" ry="30"/>
  </g>
  <path d="M0 820 Q310 720 600 805 T1200 790 T1600 760 V1000 H0Z" fill="#b8dfc7" opacity=".65"/>

  <!-- giant aircraft wing -->
  <g filter="url(#shadow)">
    <path d="M410 760 L1430 355 L1550 394 L640 895 Z" fill="url(#wing)" stroke="#40566e" stroke-width="8"/>
    <path d="M560 790 L1390 444" stroke="#dbe7ef" stroke-width="8" opacity=".8"/>
    <path d="M650 848 L1464 454" stroke="#71879b" stroke-width="3"/>
    <path d="M485 782 L1398 404 L1430 420 L520 815Z" fill="url(#rivets)" opacity=".5"/>
    <path d="M1378 369 L1537 394 L1447 459 L1371 438Z" fill="#f04d4d" stroke="#6f2a36" stroke-width="6"/>
  </g>
  <!-- Sun Wukong flying the plane -->
  <g transform="translate(1290 60)" filter="url(#shadow)">
    <path d="M40 210 Q125 170 220 207 L260 260 L20 260Z" fill="#f04c42" stroke="#702f31" stroke-width="6"/>
    <ellipse cx="140" cy="162" rx="63" ry="58" fill="#d88f58" stroke="#6d3b2c" stroke-width="6"/>
    <path d="M87 144 Q140 77 195 144" fill="#4a281e" stroke="#28201e" stroke-width="7"/>
    <path d="M83 125 Q43 77 67 35 Q100 68 113 111 M197 125 Q235 77 213 35 Q180 68 168 111" fill="#d8a72b" stroke="#67451c" stroke-width="6"/>
    <circle cx="118" cy="162" r="8"/><circle cx="165" cy="162" r="8"/>
    <path d="M120 193 Q142 207 168 191" fill="none" stroke="#6d2f2c" stroke-width="6"/>
    <path d="M105 260 L95 320 M180 260 L193 320" stroke="#d88f58" stroke-width="20" stroke-linecap="round"/>
    <path d="M75 311 L220 311" stroke="#e8c04b" stroke-width="12"/>
    <text x="140" y="360" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#3f2a23">孙悟空驾驶舱</text>
  </g>

  <!-- bicycle -->
  <g transform="translate(470 600)" filter="url(#shadow)">
    <circle cx="30" cy="170" r="78" fill="none" stroke="#263b51" stroke-width="13"/><circle cx="300" cy="170" r="78" fill="none" stroke="#263b51" stroke-width="13"/>
    <g stroke="#7d95a9" stroke-width="3" opacity=".8"><path d="M30 92V248 M-48 170H108 M-24 116L84 224 M-24 224L84 116"/><path d="M300 92V248 M222 170H378 M246 116L354 224 M246 224L354 116"/></g>
    <path d="M30 170 L120 78 L215 170 L30 170 M120 78 L300 170 L215 170 M120 78 L150 30" fill="none" stroke="#e2383f" stroke-width="11" stroke-linejoin="round"/>
    <circle cx="215" cy="170" r="17" fill="#ffc23d" stroke="#6b421a" stroke-width="5"/>
    <path d="M140 30 h55 M150 30 L140 2" stroke="#263b51" stroke-width="9" stroke-linecap="round"/>
    <path d="M112 78 Q115 45 138 30" stroke="#263b51" stroke-width="8" fill="none"/>
    <text x="165" y="292" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#253a50">鹈鹕专属单车</text>
  </g>

  <!-- pelican body and neck -->
  <g transform="translate(330 290)" filter="url(#shadow)">
    <ellipse cx="370" cy="335" rx="190" ry="145" fill="url(#feather)" stroke="#536b80" stroke-width="8"/>
    <path d="M240 315 Q205 250 236 163 Q253 112 302 95 Q360 77 400 116 Q430 150 407 212 L386 333Z" fill="url(#feather)" stroke="#536b80" stroke-width="8"/>
    <ellipse cx="315" cy="120" rx="70" ry="58" fill="#fbfcf8" stroke="#536b80" stroke-width="8"/>
    <path d="M258 137 Q190 130 72 172 Q42 182 72 203 Q186 233 286 190Z" fill="#f4b44b" stroke="#704d2a" stroke-width="8"/>
    <path d="M91 181 Q175 190 270 175" fill="none" stroke="#d7832d" stroke-width="5"/>
    <circle cx="333" cy="111" r="12" fill="#1f2c3a"/><circle cx="337" cy="106" r="4" fill="#fff"/>
    <path d="M354 87 Q385 75 403 95" fill="none" stroke="#cf4c4e" stroke-width="9"/>
    <path d="M306 432 L285 540 M414 433 L458 532" stroke="#e2a62c" stroke-width="16" stroke-linecap="round"/>
    <path d="M270 539 h49 M442 532 h49" stroke="#714b28" stroke-width="10" stroke-linecap="round"/>
    <!-- spread wings -->
    <path d="M255 300 Q110 250 -42 66 Q-74 29 -42 15 Q22 18 108 80 Q170 124 300 218Z" fill="url(#feather)" stroke="#536b80" stroke-width="8"/>
    <path d="M430 290 Q545 198 700 74 Q749 35 774 68 Q758 140 682 217 Q590 309 456 373Z" fill="url(#feather)" stroke="#536b80" stroke-width="8"/>
    <g fill="none" stroke="#a9bdcb" stroke-width="5" opacity=".9"><path d="M225 276 Q104 188 8 83"/><path d="M252 263 Q142 153 43 48"/><path d="M470 313 Q607 203 724 97"/><path d="M493 328 Q638 244 757 153"/></g>
    <text x="365" y="585" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#21384c">展开翅膀的鹈鹕</text>
  </g>

  <!-- polar bear perched on pelican wing -->
  <g transform="translate(610 185)" filter="url(#shadow)">
    <ellipse cx="185" cy="175" rx="125" ry="90" fill="#f6fbff" stroke="#526b7f" stroke-width="8"/>
    <circle cx="100" cy="105" r="47" fill="#f6fbff" stroke="#526b7f" stroke-width="8"/><circle cx="75" cy="66" r="15" fill="#cddce7" stroke="#526b7f" stroke-width="5"/><circle cx="126" cy="66" r="15" fill="#cddce7" stroke="#526b7f" stroke-width="5"/>
    <circle cx="86" cy="105" r="7"/><circle cx="116" cy="105" r="7"/><ellipse cx="101" cy="125" rx="16" ry="11" fill="#273846"/>
    <path d="M245 170 Q304 142 334 174 Q347 189 322 204 L254 211" fill="#f6fbff" stroke="#526b7f" stroke-width="8"/>
    <path d="M130 223 L110 285 M224 229 L246 284" stroke="#f6fbff" stroke-width="26" stroke-linecap="round"/>
    <path d="M97 284 h37 M232 284 h37" stroke="#526b7f" stroke-width="10" stroke-linecap="round"/>
    <text x="170" y="344" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#294257">北极熊 · 坐骑</text>
  </g>

  <!-- Qin Shi Huang riding and tightening screw -->
  <g transform="translate(780 40)" filter="url(#shadow)">
    <path d="M80 207 Q128 177 182 207 L207 326 L52 326Z" fill="#7f1c32" stroke="#431b29" stroke-width="7"/>
    <path d="M69 213 Q130 230 196 211 L186 260 Q126 275 75 255Z" fill="#d8a936" opacity=".9"/>
    <circle cx="133" cy="142" r="57" fill="#d99c6b" stroke="#5c392d" stroke-width="7"/>
    <path d="M78 133 Q132 54 191 129 L176 101 Q132 72 91 103Z" fill="#161c29" stroke="#273142" stroke-width="9"/>
    <path d="M80 116 L57 76 L96 91 M188 116 L211 76 L172 91" fill="#e6bd4e" stroke="#67451c" stroke-width="6"/>
    <circle cx="112" cy="143" r="7"/><circle cx="154" cy="143" r="7"/><path d="M112 177 Q133 189 155 176" fill="none" stroke="#7c3031" stroke-width="5"/>
    <path d="M80 326 L40 387 M181 326 L225 387" stroke="#d99c6b" stroke-width="18" stroke-linecap="round"/>
    <!-- arms holding screwdriver -->
    <path d="M77 232 L10 300 M189 232 L267 288" stroke="#d99c6b" stroke-width="18" stroke-linecap="round"/>
    <path d="M7 302 L274 292" stroke="#405467" stroke-width="11"/><path d="M245 272 L269 317" stroke="#c3d2dc" stroke-width="7"/>
    <circle cx="273" cy="293" r="22" fill="none" stroke="#d29b34" stroke-width="7"/><path d="M264 280 L281 307 M281 280 L264 307" stroke="#d29b34" stroke-width="4"/>
    <text x="140" y="438" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#482430">秦始皇 · 正在打螺丝</text>
  </g>

  <!-- puzzle board -->
  <g transform="translate(35 545)" filter="url(#shadow)">
    <rect width="390" height="410" rx="24" fill="#fffdf8" stroke="#29465e" stroke-width="7"/>
    <rect x="18" y="17" width="354" height="46" rx="12" fill="#29465e"/>
    <text x="195" y="49" text-anchor="middle" fill="#fff" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700">摸糖果 · 保证问题</text>
    <text x="24" y="91" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#263b51">黑袋中三种口味，每种有圆形与五角星形。</text>
    <text x="24" y="115" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#263b51">形状可凭手感分辨，取出后要求保证：</text>
    <text x="24" y="140" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" fill="#7b2935">苹果圆 + 桃子星，或 桃子圆 + 苹果星。</text>
    <g transform="translate(22 158)">
      <rect width="346" height="150" fill="#f3f7fa" stroke="#7790a2" stroke-width="2"/>
      <path d="M0 37 H346 M0 75 H346 M0 112 H346 M78 0 V150 M167 0 V150 M256 0 V150" stroke="#7790a2" stroke-width="2"/>
      <g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle" fill="#263b51"><text x="39" y="25">形状</text><text x="122" y="25">苹果味</text><text x="211" y="25">桃子味</text><text x="301" y="25">西瓜味</text><text x="39" y="62">圆形</text><text x="39" y="100">五角星</text><text x="122" y="62">7</text><text x="211" y="62">9</text><text x="301" y="62">8</text><text x="122" y="100">7</text><text x="211" y="100">6</text><text x="301" y="100">4</text></g>
    </g>
    <text x="24" y="335" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#263b51">最多可先避开两类关键配对：28 颗。</text>
    <rect x="23" y="350" width="344" height="45" rx="12" fill="#f6c945" stroke="#8e601e" stroke-width="3"/>
    <text x="195" y="381" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="800" fill="#402c1e">答案：最少取出 29 个</text>
  </g>

  <!-- speech bubble -->
  <g transform="translate(990 500)" filter="url(#shadow)">
    <path d="M0 0 H550 Q580 0 580 30 V340 Q580 370 550 370 H275 L205 428 L216 370 H30 Q0 370 0 340Z" fill="#fff9e9" stroke="#7a4b2f" stroke-width="7"/>
    <text x="28" y="42" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="800" fill="#733030">鹈鹕喊出完整题面：</text>
    <text x="28" y="76" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3e3340">“在一个黑色的袋子里放有三种口味的糖果，每种糖果</text>
    <text x="28" y="99" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3e3340">有两种不同的形状（圆形和五角星形，不同的形状靠手感</text>
    <text x="28" y="122" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3e3340">可以分辨）。现已知不同口味的糖和不同形状的数量统计</text>
    <text x="28" y="145" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3e3340">如下表。参赛者需要在活动前决定摸出的糖果数目，那么，</text>
    <text x="28" y="168" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3e3340">最少取出多少个糖果才能保证手中同时拥有不同形状的</text>
    <text x="28" y="191" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3e3340">苹果味和桃子味的糖？（圆形苹果味匹配五角星桃子味，</text>
    <text x="28" y="214" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3e3340">或者圆形桃子味匹配五角星苹果味都满足要求。）”</text>
    <path d="M28 235 H550" stroke="#e4c77c" stroke-width="2"/>
    <text x="28" y="270" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#7b2935">最多 28 颗仍可避开两种关键配对。</text>
    <text x="28" y="316" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="900" fill="#b12e3c">“答案就是 29！”</text>
  </g>

  <text x="800" y="966" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#37566f" opacity=".85">SAEPS 创意数学插画 · 矢量 SVG · 1600 × 1000</text>
</svg>
