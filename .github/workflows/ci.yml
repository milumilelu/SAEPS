name: CI

on:
  push:
  pull_request:

jobs:
  publication-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: pytest -q
      - run: python scripts/00_smoke_test.py --output-root "$env:RUNNER_TEMP/saeps-smoke"
      - run: python scripts/01_validate_core.py --output-root "$env:RUNNER_TEMP/saeps-core"
      - run: python scripts/04_validate_profile.py --output-root "$env:RUNNER_TEMP/saeps-profile"
      - name: Validate frozen V5 evidence and deterministic artifacts
        run: python scripts/validate_v5_repository.py
