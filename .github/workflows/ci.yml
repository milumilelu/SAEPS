name: CI

on:
  push:
  pull_request:

jobs:
  publication-validation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12.13"
      - run: uv python install 3.12.13
      - run: uv venv --python 3.12.13
      - run: uv pip install --python .venv\Scripts\python.exe -r requirements-lock.txt
      - run: uv pip install --python .venv\Scripts\python.exe -e . --no-deps
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python scripts/00_smoke_test.py --output-root "$env:RUNNER_TEMP/saeps-smoke"
      - run: uv run --no-sync python scripts/01_validate_core.py --output-root "$env:RUNNER_TEMP/saeps-core"
      - run: uv run --no-sync python scripts/04_validate_profile.py --output-root "$env:RUNNER_TEMP/saeps-profile"
      - name: Validate frozen V5 evidence and deterministic artifacts
        run: uv run --no-sync python scripts/validate_v5_repository.py
